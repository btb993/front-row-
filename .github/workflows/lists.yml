name: Ready-made lists
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
    paths:
      - tools/build-lists.mjs
      - .github/workflows/lists.yml
permissions:
  contents: write
concurrency:
  group: lists
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the lists from Wikidata, Wikipedia and IMDb ratings
        run: node tools/build-lists.mjs
      - name: Save them if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pool.json data/lists.json
          git diff --cached --quiet || (git commit -m "Update ready-made lists" && git pull --rebase && git push)
